<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Impressum · FC Fasanerie-Nord</title>
  <meta name="theme-color" content="#0f3d2e" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--bg); margin: 0; }
    .recht { max-width: 640px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
    .recht-zurueck { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--green-800); font-weight: 700; text-decoration: none; }
    .recht h1 { margin: 8px 0 16px; font-size: 28px; font-weight: 800; }
    .recht h2 { margin: 22px 0 8px; font-size: 16px; font-weight: 700; }
    .recht p { font-size: 15px; line-height: 1.5; color: var(--ink); }
    .recht-platzhalter { padding: 12px 14px; border-radius: var(--radius-btn); background: var(--amber-050); color: var(--gold-ink-2); font-weight: 600; }
  </style>
</head>
<body>
  <main class="recht">
    <a class="recht-zurueck" href="./">‹ Zurück zur App</a>
    <h1>Impressum</h1>
    <p class="recht-platzhalter">Platzhalter. Den Text dieser Seite liefert der Verein.</p>
    <h2>Angaben</h2>
    <p>Platzhalter: Name, Anschrift, Kontakt, vertretungsberechtigte Person.</p>
  </main>
</body>
</html>
