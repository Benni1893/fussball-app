<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC Fasanerie-Nord · Mannschafts-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231b5e3f'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3EFN%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- ===================== Kopfzeile ===================== -->
  <header class="app-header">
    <div class="brand">
      <span class="crest" aria-hidden="true">
        <svg viewBox="0 0 64 72" width="44" height="50">
          <path d="M32 2 L60 12 V36 C60 54 48 64 32 70 C16 64 4 54 4 36 V12 Z"
                fill="#1b5e3f" stroke="#d4af37" stroke-width="3"/>
          <path d="M32 8 L54 16 V36 C54 50 44 58 32 63 C20 58 10 50 10 36 V16 Z"
                fill="#0f3d2e"/>
          <text x="32" y="38" font-size="20" font-weight="800" fill="#d4af37"
                text-anchor="middle" font-family="Inter, Arial">FN</text>
          <circle cx="32" cy="50" r="6" fill="#f5f5f5"/>
          <path d="M32 44 l1.8 3.6 4 .3 -3 2.7 1 3.9 -3.8 -2.2 -3.8 2.2 1 -3.9 -3 -2.7 4 -.3 z" fill="#0f3d2e"/>
        </svg>
      </span>
      <div class="brand-text">
        <strong>FC Fasanerie-Nord</strong>
        <small>1. Herrenmannschaft · Saison 2025/26</small>
      </div>
    </div>

    <div class="user-switch" id="userBox"></div>
  </header>

  <!-- ===================== Navigation ===================== -->
  <nav class="app-nav" id="appNav">
    <button class="nav-btn is-active" data-view="dashboard"><span>🏠</span> Übersicht</button>
    <button class="nav-btn" data-view="kalender"><span>📅</span> Kalender</button>
    <button class="nav-btn" data-view="katalog"><span>📖</span> Strafenkatalog</button>
    <button class="nav-btn" data-view="strafen"><span>💰</span> Strafen-Konto</button>
    <button class="nav-btn" data-view="admin" id="navAdmin" style="display:none"><span>👮</span> Rollen</button>
  </nav>

  <!-- ===================== Inhalt ===================== -->
  <main id="view" class="view"></main>

  <footer class="app-footer">
    <span>FC Fasanerie-Nord e.V. · gegründet 1977 · Demo-Anwendung</span>
    <button id="resetBtn" class="link-btn" title="Alle lokalen Eingaben zurücksetzen">Demo-Daten zurücksetzen</button>
  </footer>

  <!-- Supabase-Client (CDN) -> config.js (Zugang) -> db.js (Datenzugriff) -> app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
