  <!-- Splash-/Ladeanimation: inline, damit nichts nachgeladen wird und es im ersten Frame paint't.
       Farben aus den bestehenden Variablen (Fallback = gleicher Wert gegen weisses Aufblitzen). -->
  <style id="splash-style">
    /* Kompletter, EINFARBIGER Hintergrund: nicht nur das Overlay, sondern das GANZE Dokument
       (html + body) wird waehrend des Splash gruen gefaerbt. So kann kein weisser Streifen
       durchscheinen - egal wie iOS Safe Area / Toolbar behandelt. Die Klasse .sp-lock wird
       beim Entfernen des Splash wieder geloescht -> App danach normal hell. */
    html.sp-lock, html.sp-lock body{background:#144a37!important;background:var(--green-800,#144a37)!important}
    /* KERN-FIX gegen den flackernden weissen Balken: Waehrend des Splash ALLES ausser dem Splash
       unsichtbar machen (Kopfzeile, Nav UND der komplette Inhalt). iOS hebt fixe UND als eigene
       Ebene komponierte Elemente (Nav, Content-Karten) UEBER den Splash, egal welcher z-index.
       WICHTIG: visibility:hidden statt display:none - malt nichts (kein Durchblitzen), veraendert
       aber das Layout NICHT. So verliert die fixe Nav beim Wieder-Einblenden nicht ihre Position
       (display:none-Toggle auf position:fixed zerreisst auf iOS das Layout) und die Kopfzeile
       bleibt messbar. sp-lock liegt nur waehrend des Splash an. */
    html.sp-lock body > *:not(#splash){visibility:hidden!important}
    #splash{position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:#144a37;background:var(--green-800,#144a37);   /* = Icon-Hintergrund #144a37 -> Quadrat-Ecken verschwinden, nur das Wappen dreht sich */
      opacity:1;transition:opacity 200ms ease;-webkit-tap-highlight-color:transparent}
    #splash.sp-hide{opacity:0}
    /* Buehne: feste px-Groesse, KEINE Safe-Area-Margins. Perspektive -> die rotateY-Drehung wirkt
       raeumlich (Muenze), nicht wie flaches Zusammenschieben. Position steht (Hoehe eingefroren im
       Skript) -> hier nichts an der Positionierung aendern. */
    #splash .sp-stage{position:relative;width:128px;height:128px;perspective:700px}
    /* Gedecktes, warmes Gold (metallisch). --goldL = helle Seite, --goldD = dunkle Seite.
       --sp-turn = Dauer EINER Umdrehung (hier zum leichten Anpassen). */
    #splash{--goldL:#D8BC72;--goldD:#7C6230;--sp-turn:0.9s}
    /* Muenze: volle rotateY-Umdrehungen im Wechsel (vor, dann zurueck), um den eigenen Mittelpunkt.
       Nur transform -> Bounding Box/Position aendern sich NICHT. Doppelseitig (preserve-3d), damit die
       Rueckseite das Wappen richtig herum (nicht spiegelverkehrt) zeigt. */
    #splash .sp-coin{position:absolute;inset:0;transform-origin:50% 50%;transform-style:preserve-3d;
      will-change:transform;animation:sp-rotate calc(var(--sp-turn,1.4s) * 2) ease-in-out infinite}
    /* 0->360 (eine volle Umdrehung), dann 360->0 (zurueck). ease-in-out -> weiche Richtungswechsel an
       0deg/360deg (jeweils frontal). Start=Ende (0deg) -> nahtloser Loop. Eine Umdrehung dauert --sp-turn. */
    @keyframes sp-rotate{ 0%,100%{transform:rotateY(0deg)} 50%{transform:rotateY(360deg)} }
    /* Zwei Flaechen: Vorderseite und (um 180deg gedrehte) Rueckseite, beide backface ausgeblendet.
       Auf der Rueckseite das Wappen zusaetzlich scaleX(-1) -> nach der 180deg-Drehung wieder lesbar. */
    #splash .sp-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
    #splash .sp-back{transform:rotateY(180deg)}
    #splash .sp-back .sp-logo{transform:scaleX(-1)}
    /* Goldener Ring: metallischer Verlauf (hell oben-links -> dunkel unten-rechts). Teil der Muenze -> kippt mit. */
    #splash .sp-ring{position:absolute;inset:0;border-radius:50%;
      background:linear-gradient(135deg,var(--goldL) 0%,var(--goldD) 100%)}
    /* Wappen rund beschnitten (Quadrat-Ecken weg), sitzt IM Ring (inset = Ringbreite, dezent). */
    #splash .sp-disc{position:absolute;inset:5px;border-radius:50%;overflow:hidden;background:#144a37}
    #splash .sp-logo{width:100%;height:100%;display:block}
    /* Schatten: liegt flach unter der Muenze, kippt NICHT mit. Nimmt die Bewegung nur ueber scaleX+opacity
       auf: breit/weich in Mittelstellung (0/50/100%), schmaler/dunkler bei starkem Kippen (25/75%).
       KEIN animierter box-shadow/blur. */
    #splash .sp-shadow{position:absolute;left:50%;top:142px;width:96px;height:14px;margin-left:-48px;
      border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 70%);
      transform-origin:50% 50%;will-change:transform,opacity;animation:sp-shadow 2s ease-in-out infinite}
    @keyframes sp-shadow{0%,50%,100%{transform:scaleX(1);opacity:.5}25%,75%{transform:scaleX(.78);opacity:.72}}
    /* Reduced-Motion: keine Bewegung -> Muenze flach (Wappen + Ring sichtbar), Schatten ruhig. */
    @media (prefers-reduced-motion: reduce){ #splash .sp-coin, #splash .sp-shadow{animation:none} }
  </style>

  <!-- ===================== Boot-Diagnose (laeuft VOR allen Scripten, unabhaengig von app.js) ===================== -->
  <script>
  (function(){
    var BUILD = "2026-09-05-H";                 // Build-Kennung: bei jedem Deploy hochziehen
    window.__HTML_BUILD = BUILD;
    var K = "fnboot", P = "fnboot_prev";
    try { var pr = localStorage.getItem(K); if (pr) localStorage.setItem(P, pr); } catch(e){}   // vorherigen Lauf sichern
    var t0 = Date.now();
    var L = { build: BUILD, at: new Date().toISOString(), url: location.href, phases: [], errors: [] };
    try { L.standalone = !!((window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone); } catch(e){ L.standalone = null; }
    try { L.online = navigator.onLine; } catch(e){ L.online = null; }
    function save(){ try { localStorage.setItem(K, JSON.stringify(L)); } catch(e){} }
    window.__boot   = function(ph){ L.phases.push(ph + "@" + (Date.now()-t0) + "ms"); save(); };
    window.__bootErr = function(kind,msg,src,line){ L.errors.push(kind + ": " + String(msg) + (src ? (" [" + src + ":" + (line||0) + "]") : "") + " @" + (Date.now()-t0) + "ms"); save(); };
    window.__boot("boot:start");
    window.addEventListener("error", function(e){ window.__bootErr("error", (e && (e.message || (e.error && e.error.message))) || "?", e && e.filename, e && e.lineno); });
    window.addEventListener("unhandledrejection", function(e){ var r = e && e.reason; window.__bootErr("rejection", (r && (r.message || r)) || "?"); });
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
    window.__showDiag = function(reason){
      try { if (window.__hideSplash) window.__hideSplash(); } catch(e){}
      try { document.documentElement.classList.remove("sp-lock"); } catch(e){}
      var prev = null; try { prev = localStorage.getItem(P); } catch(e){}
      var lastErr = L.errors.length ? L.errors[L.errors.length-1] : "—";
      var lastPh  = L.phases.length ? L.phases[L.phases.length-1] : "—";
      var payload = "";
      try { payload = JSON.stringify({ current: L, previous: prev ? (function(){ try { return JSON.parse(prev); } catch(e){ return prev; } })() : null }, null, 2); } catch(e){ payload = "(Log nicht lesbar)"; }
      var host = document.getElementById("view") || document.body;
      host.innerHTML =
        '<div style="max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 40px;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#1c2620">'
        + '<h1 style="font-size:1.2rem;margin:0 0 10px">Diagnose</h1>'
        + '<div style="background:#f3f0e9;border:1px solid #ddd;border-radius:10px;padding:12px 14px;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere">'
        + "Grund: " + esc(reason||"?") + "\n"
        + "Build HTML: " + esc(BUILD) + "   App: " + esc(window.__APP_BUILD || "— (app.js nicht geladen)") + "\n"
        + "Letzte Phase: " + esc(lastPh) + "\n"
        + "Phasen: " + esc(L.phases.join("  →  ") || "—") + "\n"
        + "Standalone (PWA): " + (L.standalone ? "ja" : (L.standalone===false ? "nein" : "?")) + "   Online: " + (L.online ? "ja" : (L.online===false ? "nein" : "?")) + "\n"
        + "Letzter Fehler: " + esc(lastErr)
        + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">'
        + '<button id="dgR" style="min-height:44px;padding:10px 14px;border:0;border-radius:10px;background:#144a37;color:#fff;font-weight:700">Neu laden</button>'
        + '<button id="dgC" style="min-height:44px;padding:10px 14px;border:1px solid #ccc;border-radius:10px;background:#fff;font-weight:700">Cache leeren und neu laden</button>'
        + '<button id="dgK" style="min-height:44px;padding:10px 14px;border:1px solid #ccc;border-radius:10px;background:#fff;font-weight:700">Log kopieren</button>'
        + '</div>'
        + (prev ? '<details style="margin-top:14px"><summary style="min-height:44px;display:flex;align-items:center;color:#144a37;font-weight:600">Vorheriger Start (Log)</summary><pre style="font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f0e9;border-radius:8px;padding:10px">' + esc(prev) + '</pre></details>' : '')
        + '</div>';
      var r = document.getElementById("dgR"); if (r) r.onclick = function(){ location.reload(); };
      var c = document.getElementById("dgC"); if (c) c.onclick = function(){
        try { if (window.caches && caches.keys) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } catch(e){}
        try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(x){ x.unregister(); }); }); } catch(e){}
        setTimeout(function(){ location.reload(); }, 400);
      };
      var k = document.getElementById("dgK"); if (k) k.onclick = function(){
        try { navigator.clipboard.writeText(payload); k.textContent = "Kopiert ✓"; }
        catch(e){ try { var ta = document.createElement("textarea"); ta.value = payload; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); k.textContent = "Kopiert ✓"; } catch(x){} }
      };
    };
    // Watchdog: steht nach 8s noch das statische Skelett -> Boot ist nie durchgelaufen -> Diagnose.
    setTimeout(function(){ var sk = document.getElementById("__skeleton"); var v = document.getElementById("view"); if (sk && v && v.contains(sk)) window.__showDiag("Watchdog: 8s, keine Ansicht gerendert"); }, 8000);
    // Manuell aufrufbar: ?debug=1
    if (/[?&]debug=1/.test(location.search)) setTimeout(function(){ window.__showDiag("debug=1 (manuell)"); }, 300);
    // Wiedereinstieg (z. B. Rueckkehr aus dem PayPal-Tab): Resume protokollieren; ist die Ansicht dann
    // leer -> Diagnose automatisch zeigen (der Load-Watchdog laeuft bei BFCache-Resume NICHT erneut).
    function checkResumeBlank(){
      var v = document.getElementById("view");
      var blank = !v || !v.innerHTML.trim() || !!document.getElementById("__skeleton");
      if (blank && !(document.body && document.body.classList.contains("auth-mode"))) window.__showDiag("Wiedereinstieg: Ansicht leer (Resume/BFCache)");
    }
    window.addEventListener("pageshow", function(e){ window.__boot("pageshow persisted=" + (e && e.persisted ? "yes" : "no")); setTimeout(checkResumeBlank, 1500); });
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") { window.__boot("visible"); setTimeout(checkResumeBlank, 1500); } });
  })();
  </script>

  <!-- ===================== Splash-/Ladeanimation ===================== -->
  <div id="splash" role="status" aria-label="Lädt"><div class="sp-stage"></div></div>
  <script>
  (function(){
    // Splash: Vereinswappen dreht sich wie eine Muenze (rotateY, volle Umdrehungen im Wechsel),
    // goldener Ring, flacher Schatten darunter. Doppelseitig -> Rueckseite nie spiegelverkehrt.
    var FACE='<div class="sp-ring"></div><div class="sp-disc"><img class="sp-logo" src="assets/icon-512.png" width="118" height="118" alt="" draggable="false"></div>';
    var LOGO='<div class="sp-shadow"></div><div class="sp-coin"><div class="sp-face sp-front">'+FACE+'</div><div class="sp-face sp-back">'+FACE+'</div></div>';
    var splash=document.getElementById("splash"); if(!splash) return;
    /* ===================== SCHRITT 2: HOEHE EINMALIG EINFRIEREN =====================
       Messung bewies: #splash (inset:0) waechst mit innerHeight (797->844) -> zentriertes Logo rutscht.
       Fix: Hoehe EINMAL als festen px-Wert setzen (volle, stabile Bildschirmhoehe) und von bottom:0
       loesen -> der Kasten (und damit die Mitte) kann sich nicht mehr veraendern, egal was der
       Viewport beim Start oder die Safari-Adressleiste tut. KEIN Resize-Update. */
    (function(){
      var H0=Math.max(window.innerHeight||0, document.documentElement.clientHeight||0, (window.screen&&window.screen.height)||0);
      splash.style.height=H0+"px";
      splash.style.bottom="auto";   // von inset:0 -> top:0 + feste Hoehe
    })();
    try{ document.documentElement.classList.add("sp-lock"); }catch(e){} // Dokument gruen + App-Chrome ausblenden
    var stage=splash.querySelector(".sp-stage");
    var reduce=false; try{ reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    stage.innerHTML=LOGO;

    /* Anzeige erst, wenn das Wappen geladen ist (Position steht ohnehin fix). Gruener Hintergrund ab
       Frame 1; kein Aufblitzen in falscher Groesse. Nur opacity. */
    var logo=stage.querySelector(".sp-logo");
    if(!reduce) stage.style.transition="opacity 140ms ease";
    stage.style.opacity="0";
    function show(){ stage.style.opacity="1"; }
    if(logo.complete && logo.naturalWidth) show();
    else { logo.addEventListener("load",show); logo.addEventListener("error",show); setTimeout(show,400); } // nicht ewig warten
    var MAX=3000, FADE=200, MINR=400, hidden=false, start=Date.now();  // MAX=Maximaldauer, FADE=Fade-out, MINR=Mindestanzeige
    function remove(){
      var s=document.getElementById("splash"); if(s&&s.parentNode) s.parentNode.removeChild(s);
      var st=document.getElementById("splash-style"); if(st&&st.parentNode) st.parentNode.removeChild(st); // DOM + Keyframes weg -> Animation gestoppt
    }
    function hide(){ if(hidden) return; hidden=true;
      try{ document.documentElement.classList.remove("sp-lock"); }catch(e){} // Faerbung + Ausblendung SOFORT loesen -> App erscheint sauber
      try{ window.dispatchEvent(new Event("fn:chrome-shown")); }catch(e){}    // App-Chrome wieder sichtbar -> Kopfzeilenhoehe neu messen
      // Weicher Fade-out (CSS: #splash.sp-hide{opacity:0}, 200ms). Die Drehung laeuft dabei NORMAL
      // weiter (kein Einfrieren, kein Zurueckspringen); erst nach dem Fade wird der Knoten entfernt.
      splash.classList.add("sp-hide"); setTimeout(remove, FADE+40);
    }
    // Ladevorgang fertig -> SOFORT ausblenden, auch mitten in der Drehung (keine Zyklus-Warterei mehr).
    // __hideSplash wird erst nach dem ersten render() aufgerufen (erste Ansicht steht -> kein Layout-Shift).
    // Einzige Bremse: Mindestanzeige 400ms gegen Aufblitzen bei sehr schnellem Laden.
    window.__hideSplash=function(){ var el=Date.now()-start; if(el>=MINR) hide(); else setTimeout(hide, MINR-el); };
    setTimeout(function(){ if(window.__hideSplash) window.__hideSplash(); }, MAX);   // spaetestens nach 3s
  })();
  </script>
