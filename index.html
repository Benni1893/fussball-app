<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC Fasanerie-Nord · Mannschafts-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
</head>
<body>

  <!-- ===================== Kopfzeile ===================== -->
  <header class="app-header">
    <div class="brand">
      <span class="crest">
        <img src="assets/logo.png" class="crest-logo" alt="FC Fasanerie-Nord Logo" />
      </span>
      <div class="brand-text">
        <strong>FC Fasanerie-Nord</strong>
        <small>1. Herrenmannschaft · Saison 2025/26</small>
      </div>
    </div>

    <div class="user-switch" id="userBox"></div>
  </header>

  <!-- ===================== Navigation ===================== -->
  <nav class="app-nav" id="appNav">
    <button class="nav-btn is-active" data-view="dashboard"><span>🏠</span> Übersicht</button>
    <button class="nav-btn" data-view="kalender"><span>📅</span> Kalender</button>
    <button class="nav-btn" data-view="katalog"><span>📖</span> Strafenkatalog</button>
    <button class="nav-btn" data-view="strafen"><span>💰</span> Strafen-Konto</button>
    <button class="nav-btn" data-view="lineup" id="navLineup" style="display:none"><span>🧩</span> Aufstellung</button>
    <button class="nav-btn" data-view="admin" id="navAdmin" style="display:none"><span>👮</span> Rollen</button>
  </nav>

  <!-- ===================== Inhalt ===================== -->
  <main id="view" class="view"></main>

  <footer class="app-footer">
    <span>FC Fasanerie-Nord e.V. · gegründet 1977 · Demo-Anwendung</span>
    <button id="resetBtn" class="link-btn" title="Alle lokalen Eingaben zurücksetzen">Demo-Daten zurücksetzen</button>
  </footer>

  <!-- Supabase-Client (CDN) -> config.js (Zugang) -> db.js (Datenzugriff) -> app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
