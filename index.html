<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FC Fasanerie-Nord · Mannschafts-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Splash-/Ladeanimation: inline, damit nichts nachgeladen wird und es im ersten Frame paint't.
       Farben aus den bestehenden Variablen (Fallback = gleicher Wert gegen weisses Aufblitzen). -->
  <style id="splash-style">
    #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
      background:#0f3d2e;background:var(--green-900,#0f3d2e);
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity:1;transition:opacity 200ms ease;will-change:opacity;-webkit-tap-highlight-color:transparent}
    #splash.sp-hide{opacity:0}
    #splash .sp-stage{width:132px;height:132px;display:grid;place-items:center}
    #splash svg{width:100%;height:100%;display:block;overflow:visible}
    #splash .c-w{fill:var(--card,#fff)} #splash .c-g{fill:var(--gold-500,#d4af37)} #splash .c-l{fill:var(--green-050,#e9f3ee)}
    #splash .s-w{stroke:var(--card,#fff)} #splash .s-g{stroke:var(--gold-500,#d4af37)} #splash .s-l{stroke:var(--green-050,#e9f3ee)}
    #splash .sp-sh{fill:#000;opacity:.28}
    /* 1 Ball auf/ab */
    .a1 .ball{transform-origin:50px 60px;animation:a1b .9s cubic-bezier(.4,0,.5,1) infinite}
    .a1 .sh{transform-origin:50px 84px;animation:a1s .9s cubic-bezier(.4,0,.5,1) infinite}
    @keyframes a1b{0%,100%{transform:translateY(-28px)}50%{transform:translateY(0)}}
    @keyframes a1s{0%,100%{transform:scaleX(.55);opacity:.16}50%{transform:scaleX(1);opacity:.32}}
    /* 2 Ball ins Tor */
    .a2 .ball{transform-origin:54px 55px;animation:a2r 1.5s ease-in infinite}
    @keyframes a2r{0%{transform:translateX(-46px) rotate(0)}62%,100%{transform:translateX(22px) rotate(400deg)}}
    /* 3 Stoppuhr */
    .a3 .hand{transform-origin:50px 52px;animation:a3 1.1s linear infinite}
    @keyframes a3{to{transform:rotate(360deg)}}
    /* 4 Trikotnummer */
    .a4 .num{transform-origin:50px 52px;animation:a4 1.8s ease-in-out infinite}
    @keyframes a4{0%{transform:rotateY(-90deg);opacity:0}22%,72%{transform:rotateY(0);opacity:1}100%{transform:rotateY(90deg);opacity:0}}
    /* 5 Eckfahne */
    .a5 .flag{transform-origin:32px 26px;animation:a5 .95s ease-in-out infinite}
    @keyframes a5{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
    /* 6 Mittelkreis */
    .a6 .ring{stroke-dasharray:100;stroke-dashoffset:100;animation:a6 1.7s ease-in-out infinite}
    .a6 .mid{opacity:0;animation:a6m 1.7s ease-in-out infinite}
    @keyframes a6{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
    @keyframes a6m{0%,45%{opacity:0}70%,100%{opacity:1}}
    /* 7 Anzeigetafel */
    .a7 .strip{animation:a7 1.4s steps(5) infinite}
    .a7 .strip2{animation:a7b 1.5s steps(4) infinite}
    @keyframes a7{from{transform:translateY(0)}to{transform:translateY(-140px)}}
    @keyframes a7b{from{transform:translateY(0)}to{transform:translateY(-112px)}}
    /* 8 Rasen maehen */
    .a8 .stripe{opacity:0;animation:a8 1.7s ease infinite}
    @keyframes a8{0%{opacity:0}18%{opacity:.5}86%{opacity:.5}100%{opacity:0}}
    .a8 .mow{transform-origin:50px 33px;animation:a8m 1.7s ease infinite}
    @keyframes a8m{0%{transform:translateX(-34px)}82%,100%{transform:translateX(34px)}}
    /* 9 Pfeife */
    .a9 .w1{transform-origin:64px 50px;animation:a9 1.3s ease-out infinite}
    .a9 .w2{transform-origin:64px 50px;animation:a9 1.3s ease-out .35s infinite}
    @keyframes a9{0%{transform:scale(.35);opacity:.85}100%{transform:scale(1.4);opacity:0}}
    /* 10 Logo */
    .a10 .logo{transform-origin:50px 50px;animation:a10 1.3s ease-in-out infinite}
    @keyframes a10{0%,100%{transform:scale(.9)}50%{transform:scale(1.06)}}
    @media (prefers-reduced-motion: reduce){ #splash *{animation:none!important} }
  </style>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <!-- Als Web-App / zum Startbildschirm: echtes Vereins-Logo als Icon -->
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#144a37" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fasanerie" />
</head>
<body>

  <!-- ===================== Splash-/Ladeanimation ===================== -->
  <div id="splash" role="status" aria-label="Lädt"><div class="sp-stage"></div></div>
  <script>
  (function(){
    // Eigenstaendige SVG-Einheiten. Eine 11. Animation = ein Eintrag mehr (+ optional CSS-Block).
    var A=[
      {id:"bounce",html:'<svg class="a1" viewBox="0 0 100 100"><ellipse class="sh sp-sh" cx="50" cy="84" rx="16" ry="4"/><g class="ball"><circle class="c-w" cx="50" cy="50" r="14"/><path class="s-g" fill="none" stroke-width="2" d="M50 40 57 46 54 55 46 55 43 46Z"/></g></svg>'},
      {id:"goal",html:'<svg class="a2" viewBox="0 0 100 100"><g fill="none"><path class="s-g" stroke-width="2.6" d="M60 32h22v42H60"/><path class="s-l" stroke-width="1" opacity=".55" d="M66 32v42M72 32v42M78 32v42M60 42h22M60 52h22M60 62h22"/></g><g class="ball"><circle class="c-w" cx="54" cy="55" r="9"/><path class="s-g" fill="none" stroke-width="1.4" d="M54 49 58 53 56 59 52 59 50 53Z"/></g></svg>'},
      {id:"stopwatch",html:'<svg class="a3" viewBox="0 0 100 100"><rect class="c-g" x="46" y="12" width="8" height="6" rx="1"/><line class="s-w" x1="50" y1="18" x2="50" y2="25" stroke-width="3"/><circle class="s-w" cx="50" cy="52" r="26" fill="none" stroke-width="3"/><line class="hand s-g" x1="50" y1="52" x2="50" y2="33" stroke-width="2.6" stroke-linecap="round"/><circle class="c-g" cx="50" cy="52" r="3"/></svg>'},
      {id:"jersey",html:'<svg class="a4" viewBox="0 0 100 100"><path class="c-l" opacity=".16" d="M36 34l8-5 6 3 6-3 8 5-5 9-5-2v25H46V41l-5 2z"/><text class="num c-w" x="50" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="34">7</text></svg>'},
      {id:"cornerflag",html:'<svg class="a5" viewBox="0 0 100 100"><path class="s-l" fill="none" stroke-width="2" opacity=".5" d="M30 76q10 2 20 6"/><line class="s-w" x1="32" y1="26" x2="32" y2="76" stroke-width="3"/><path class="flag c-g" d="M32 26 58 32 32 40Z"/></svg>'},
      {id:"circle",html:'<svg class="a6" viewBox="0 0 100 100"><line class="mid s-l" x1="50" y1="22" x2="50" y2="78" stroke-width="2" opacity=".55"/><circle class="ring s-w" cx="50" cy="50" r="24" fill="none" stroke-width="3" pathLength="100" transform="rotate(-90 50 50)"/><circle class="mid c-w" cx="50" cy="50" r="3"/></svg>'},
      {id:"scoreboard",html:'<svg class="a7" viewBox="0 0 100 100"><rect class="c-g" x="22" y="36" width="56" height="30" rx="3"/><rect x="25" y="39" width="50" height="24" rx="2" fill="#0f3d2e"/><clipPath id="a7c"><rect x="28" y="40" width="18" height="22"/></clipPath><clipPath id="a7d"><rect x="54" y="40" width="18" height="22"/></clipPath><g clip-path="url(#a7c)"><g class="strip c-l" font-family="system-ui,sans-serif" font-weight="800" font-size="17" text-anchor="middle"><text x="37" y="57">2</text><text x="37" y="85">0</text><text x="37" y="113">5</text><text x="37" y="141">1</text><text x="37" y="169">3</text><text x="37" y="197">4</text></g></g><g clip-path="url(#a7d)"><g class="strip2 c-l" font-family="system-ui,sans-serif" font-weight="800" font-size="17" text-anchor="middle"><text x="63" y="57">1</text><text x="63" y="85">7</text><text x="63" y="113">3</text><text x="63" y="141">0</text><text x="63" y="169">9</text></g></g><text class="c-w" x="50" y="57" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="16">:</text></svg>'},
      {id:"mow",html:'<svg class="a8" viewBox="0 0 100 100"><rect x="18" y="34" width="64" height="34" rx="3" class="c-l" opacity=".12"/><rect class="stripe c-l" x="20" y="36" width="9" height="30" style="animation-delay:0s"/><rect class="stripe c-l" x="31" y="36" width="9" height="30" style="animation-delay:.12s"/><rect class="stripe c-l" x="42" y="36" width="9" height="30" style="animation-delay:.24s"/><rect class="stripe c-l" x="53" y="36" width="9" height="30" style="animation-delay:.36s"/><rect class="stripe c-l" x="64" y="36" width="9" height="30" style="animation-delay:.48s"/><rect class="stripe c-l" x="75" y="36" width="7" height="30" style="animation-delay:.6s"/><rect class="mow c-g" x="46" y="30" width="8" height="6" rx="1"/></svg>'},
      {id:"whistle",html:'<svg class="a9" viewBox="0 0 100 100"><path class="w1 s-l" fill="none" stroke-width="2.6" d="M62 42a12 12 0 0 1 0 16"/><path class="w2 s-g" fill="none" stroke-width="2.6" d="M62 42a12 12 0 0 1 0 16"/><g class="c-w"><rect x="28" y="45" width="18" height="10" rx="2"/><circle cx="46" cy="50" r="14"/></g><circle class="c-g" cx="49" cy="46" r="3"/></svg>'},
      {id:"logo",html:'<svg class="a10" viewBox="0 0 100 100"><g class="logo"><circle class="s-g" cx="50" cy="50" r="30" fill="none" stroke-width="3"/><circle cx="50" cy="50" r="26" fill="#144a37"/><text class="c-l" x="50" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="22">FN</text><text class="c-g" x="50" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="9">II</text></g></svg>'}
    ];
    var splash=document.getElementById("splash"); if(!splash) return;
    var stage=splash.querySelector(".sp-stage");
    var reduce=false; try{ reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    var chosen;
    if(reduce){ for(var i=0;i<A.length;i++){ if(A[i].id==="logo"){ chosen=A[i]; break; } } if(!chosen) chosen=A[0]; }
    else {
      var last=null; try{ last=sessionStorage.getItem("splashLast"); }catch(e){}
      var pool=A.filter(function(a){ return a.id!==last; }); if(!pool.length) pool=A;
      chosen=pool[Math.floor(Math.random()*pool.length)];
      try{ sessionStorage.setItem("splashLast", chosen.id); }catch(e){}
    }
    stage.innerHTML=chosen.html;
    var start=Date.now(), MIN=400, MAX=3000, FADE=200, hidden=false, maxT;
    function remove(){
      var s=document.getElementById("splash"); if(s&&s.parentNode) s.parentNode.removeChild(s);
      var st=document.getElementById("splash-style"); if(st&&st.parentNode) st.parentNode.removeChild(st); // Animationen sicher stoppen
    }
    function hide(){ if(hidden) return; hidden=true; clearTimeout(maxT); splash.classList.add("sp-hide"); setTimeout(remove, FADE+40); }
    window.__hideSplash=function(){ var el=Date.now()-start; if(el>=MIN) hide(); else setTimeout(hide, MIN-el); };
    maxT=setTimeout(function(){ if(window.__hideSplash) window.__hideSplash(); }, MAX); // Notausblenden nach 3s
  })();
  </script>

  <!-- ===================== Kopfzeile ===================== -->
  <header class="app-header">
    <span class="hdr-logo">
      <img src="assets/logo.png" class="crest-logo" alt="FC Fasanerie-Nord" />
    </span>
    <span class="hdr-title" id="hdrTitle">FC Fasanerie-Nord</span>
    <button class="hdr-gear" id="hdrGear" type="button" aria-label="Einstellungen öffnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="hdr-gear-dot" id="hdrGearDot" hidden></span>
    </button>
  </header>

  <!-- ===================== Inhalt (einziger Scroll-Bereich) ===================== -->
  <div class="scroll-area" id="scrollArea">
    <main id="view" class="view"></main>
    <footer class="app-footer">
      <button id="resetBtn" class="link-btn" title="Neu laden">Neu laden</button>
    </footer>
  </div>

  <!-- ===================== Untere Navigation ===================== -->
  <nav class="app-nav" id="appNav">
    <button class="nav-btn is-active" data-view="dashboard">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      <span class="nav-label">Übersicht</span>
    </button>
    <button class="nav-btn" data-view="kalender">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
      <span class="nav-label">Kalender</span>
    </button>
    <button class="nav-btn" data-view="katalog">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/><path d="M9 8h6M9 11h4"/></svg>
      <span class="nav-label">Katalog</span>
    </button>
    <button class="nav-btn" data-view="strafen">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M15.5 14.5h2.5"/></svg>
      <span class="nav-label">Konto</span>
    </button>
    <button class="nav-btn" data-more id="navMore" style="display:none">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      <span class="nav-label">Mehr</span>
    </button>
  </nav>

  <!-- Simulations-Leiste (Admin: „Ansicht als …") -->
  <div class="sim-bar" id="simBar" hidden>
    <span class="sim-text">Vorschau als <b id="simRole"></b> · nur Anzeige</span>
    <button class="sim-exit" id="simExit">Zur Admin-Ansicht</button>
  </div>

  <!-- Mehr-Menü (nur Trainer/Admin) -->
  <div class="more-sheet" id="moreSheet" hidden>
    <button class="more-backdrop" data-more-close aria-label="Schließen"></button>
    <div class="more-panel">
      <div class="more-title">Mehr</div>
      <button class="more-item" data-view="einstellungen" id="moreEinstellungen">Einstellungen</button>
      <button class="more-item" data-view="lineup" id="moreLineup" style="display:none">Aufstellung</button>
      <button class="more-item" data-view="admin" id="moreAdmin" style="display:none">Rollen</button>
    </div>
  </div>

  <!-- Supabase-Client (CDN) -> config.js (Zugang) -> db.js (Datenzugriff) -> app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
