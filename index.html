<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FC Fasanerie-Nord · Mannschafts-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Splash-/Ladeanimation: inline, damit nichts nachgeladen wird und es im ersten Frame paint't.
       Farben aus den bestehenden Variablen (Fallback = gleicher Wert gegen weisses Aufblitzen). -->
  <style id="splash-style">
    /* Kompletter, EINFARBIGER Hintergrund: nicht nur das Overlay, sondern das GANZE Dokument
       (html + body) wird waehrend des Splash gruen gefaerbt. So kann kein weisser Streifen
       durchscheinen - egal wie iOS Safe Area / Toolbar behandelt. Die Klasse .sp-lock wird
       beim Entfernen des Splash wieder geloescht -> App danach normal hell. */
    html.sp-lock, html.sp-lock body{background:#144a37!important;background:var(--green-800,#144a37)!important}
    /* KERN-FIX gegen den flackernden weissen Balken: Waehrend des Splash ALLES ausser dem Splash
       unsichtbar machen (Kopfzeile, Nav UND der komplette Inhalt). iOS hebt fixe UND als eigene
       Ebene komponierte Elemente (Nav, Content-Karten) UEBER den Splash, egal welcher z-index.
       WICHTIG: visibility:hidden statt display:none - malt nichts (kein Durchblitzen), veraendert
       aber das Layout NICHT. So verliert die fixe Nav beim Wieder-Einblenden nicht ihre Position
       (display:none-Toggle auf position:fixed zerreisst auf iOS das Layout) und die Kopfzeile
       bleibt messbar. sp-lock liegt nur waehrend des Splash an. */
    html.sp-lock body > *:not(#splash){visibility:hidden!important}
    #splash{position:fixed;inset:0;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      background:#144a37;background:var(--green-800,#144a37);   /* = Icon-Hintergrund #144a37 -> Quadrat-Ecken verschwinden, nur das Wappen dreht sich */
      opacity:1;transition:opacity 200ms ease;-webkit-tap-highlight-color:transparent}
    #splash.sp-hide{opacity:0}
    /* Buehne: feste px-Groesse, KEINE Safe-Area-Margins. Perspektive -> die rotateY-Drehung wirkt
       raeumlich (Muenze), nicht wie flaches Zusammenschieben. Position steht (Hoehe eingefroren im
       Skript) -> hier nichts an der Positionierung aendern. */
    #splash .sp-stage{position:relative;width:128px;height:128px;perspective:700px}
    /* Gedecktes, warmes Gold (metallisch). --goldL = helle Seite, --goldD = dunkle Seite. Default = gedeckt. */
    #splash{--goldL:#D8BC72;--goldD:#7C6230}
    /* Muenze: kippt um die vertikale Achse (rotateY) um den eigenen Mittelpunkt. Nur transform -> die
       Bounding Box/Position aendert sich NICHT. */
    #splash .sp-coin{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;
      animation:sp-flip 2s infinite}
    /* Pendeln: Mitte -> rechts -> Mitte -> links -> Mitte. Schnell durch die Mitte, weich an den
       Umkehrpunkten (ease-out hin, ease-in zurueck). Start=Ende (0deg) -> nahtlos. |55| < 90 -> Rueckseite
       nie sichtbar (Wappen nie spiegelverkehrt). */
    @keyframes sp-flip{
      0%{transform:rotateY(0deg);animation-timing-function:ease-out}
      25%{transform:rotateY(55deg);animation-timing-function:ease-in}
      50%{transform:rotateY(0deg);animation-timing-function:ease-out}
      75%{transform:rotateY(-55deg);animation-timing-function:ease-in}
      100%{transform:rotateY(0deg)}
    }
    /* Goldener Ring: metallischer Verlauf (hell oben-links -> dunkel unten-rechts). Teil der Muenze -> kippt mit. */
    #splash .sp-ring{position:absolute;inset:0;border-radius:50%;
      background:linear-gradient(135deg,var(--goldL) 0%,var(--goldD) 100%)}
    /* Wappen rund beschnitten (Quadrat-Ecken weg), sitzt IM Ring (inset = Ringbreite, dezent). */
    #splash .sp-disc{position:absolute;inset:5px;border-radius:50%;overflow:hidden;background:#144a37}
    #splash .sp-logo{width:100%;height:100%;display:block}
    /* Schatten: liegt flach unter der Muenze, kippt NICHT mit. Nimmt die Bewegung nur ueber scaleX+opacity
       auf: breit/weich in Mittelstellung (0/50/100%), schmaler/dunkler bei starkem Kippen (25/75%).
       KEIN animierter box-shadow/blur. */
    #splash .sp-shadow{position:absolute;left:50%;top:142px;width:96px;height:14px;margin-left:-48px;
      border-radius:50%;background:radial-gradient(ellipse at center, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 70%);
      transform-origin:50% 50%;will-change:transform,opacity;animation:sp-shadow 2s ease-in-out infinite}
    @keyframes sp-shadow{0%,50%,100%{transform:scaleX(1);opacity:.5}25%,75%{transform:scaleX(.78);opacity:.72}}
    /* Reduced-Motion: keine Bewegung -> Muenze flach (Wappen + Ring sichtbar), Schatten ruhig. */
    @media (prefers-reduced-motion: reduce){ #splash .sp-coin, #splash .sp-shadow{animation:none} }
  </style>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <!-- Als Web-App / zum Startbildschirm: echtes Vereins-Logo als Icon -->
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#144a37" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fasanerie" />
</head>
<body>

  <!-- ===================== Splash-/Ladeanimation ===================== -->
  <div id="splash" role="status" aria-label="Lädt"><div class="sp-stage"></div></div>
  <script>
  (function(){
    // Splash: Vereinswappen kippt wie eine Muenze (rotateY, pendelnd), goldener Ring, flacher Schatten darunter.
    var LOGO='<div class="sp-shadow"></div><div class="sp-coin"><div class="sp-ring"></div><div class="sp-disc"><img class="sp-logo" src="assets/icon-512.png" width="118" height="118" alt="" draggable="false"></div></div>';
    var splash=document.getElementById("splash"); if(!splash) return;
    /* ===================== SCHRITT 2: HOEHE EINMALIG EINFRIEREN =====================
       Messung bewies: #splash (inset:0) waechst mit innerHeight (797->844) -> zentriertes Logo rutscht.
       Fix: Hoehe EINMAL als festen px-Wert setzen (volle, stabile Bildschirmhoehe) und von bottom:0
       loesen -> der Kasten (und damit die Mitte) kann sich nicht mehr veraendern, egal was der
       Viewport beim Start oder die Safari-Adressleiste tut. KEIN Resize-Update. */
    (function(){
      var H0=Math.max(window.innerHeight||0, document.documentElement.clientHeight||0, (window.screen&&window.screen.height)||0);
      splash.style.height=H0+"px";
      splash.style.bottom="auto";   // von inset:0 -> top:0 + feste Hoehe
    })();
    try{ document.documentElement.classList.add("sp-lock"); }catch(e){} // Dokument gruen + App-Chrome ausblenden
    var stage=splash.querySelector(".sp-stage");
    var reduce=false; try{ reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    stage.innerHTML=LOGO;

    /* Anzeige erst, wenn das Wappen geladen ist (Position steht ohnehin fix). Gruener Hintergrund ab
       Frame 1; kein Aufblitzen in falscher Groesse. Nur opacity. */
    var logo=stage.querySelector(".sp-logo"), coin=stage.querySelector(".sp-coin");
    if(!reduce) stage.style.transition="opacity 140ms ease";
    stage.style.opacity="0";
    function show(){ stage.style.opacity="1"; }
    if(logo.complete && logo.naturalWidth) show();
    else { logo.addEventListener("load",show); logo.addEventListener("error",show); setTimeout(show,400); } // nicht ewig warten
    var MAX=3000, FADE=200, DUR=2000, hidden=false, wantHide=false;   // DUR = Dauer eines vollen Pendel-Zyklus
    function remove(){
      var s=document.getElementById("splash"); if(s&&s.parentNode) s.parentNode.removeChild(s);
      var st=document.getElementById("splash-style"); if(st&&st.parentNode) st.parentNode.removeChild(st); // Animationen + Chrome-Ausblendung sicher aufheben
    }
    function hide(){ if(hidden) return; hidden=true;
      try{ document.documentElement.classList.remove("sp-lock"); }catch(e){} // Faerbung + Ausblendung SOFORT loesen -> App erscheint sauber
      try{ window.dispatchEvent(new Event("fn:chrome-shown")); }catch(e){}    // App-Chrome wieder sichtbar -> Kopfzeilenhoehe neu messen
      splash.classList.add("sp-hide"); setTimeout(remove, FADE+40); }

    if(reduce){
      // Kein Bewegungsablauf -> statisches Logo, einfache Zeitsteuerung mit kleiner Mindestzeit gegen Flackern.
      var start=Date.now(), MINR=400;
      window.__hideSplash=function(){ var el=Date.now()-start; if(el>=MINR) hide(); else setTimeout(hide, MINR-el); };
      setTimeout(function(){ if(window.__hideSplash) window.__hideSplash(); }, MAX);
      return;
    }

    // Animierter Fall: NUR an Zyklus-Grenzen ausblenden, nie mitten in der Pendelbewegung.
    function tryHide(){ if(wantHide && !hidden) hide(); }
    if(coin && coin.addEventListener){ coin.addEventListener("animationiteration", tryHide); } // je voller Pendel-Zyklus (endet in Mittelstellung)
    window.__hideSplash=function(){ wantHide=true; };               // Laden fertig -> beim naechsten Umdrehungsende ausblenden
    setTimeout(function(){ wantHide=true; tryHide(); }, MAX);        // spaetestens nach 3s (ebenfalls zur Umdrehungsgrenze)
    setTimeout(function(){ hide(); }, MAX + DUR + 400);             // Sicherheitsnetz, falls animationiteration nicht feuert
  })();
  </script>

  <!-- ===================== Kopfzeile ===================== -->
  <header class="app-header">
    <span class="hdr-logo">
      <img src="assets/logo.png" class="crest-logo" alt="FC Fasanerie-Nord" />
    </span>
    <span class="hdr-title" id="hdrTitle">FC Fasanerie-Nord</span>
    <button class="hdr-gear" id="hdrGear" type="button" aria-label="Einstellungen öffnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="hdr-gear-dot" id="hdrGearDot" hidden></span>
    </button>
  </header>

  <!-- ===================== Inhalt (einziger Scroll-Bereich) ===================== -->
  <div class="scroll-area" id="scrollArea">
    <main id="view" class="view"></main>
    <footer class="app-footer">
      <button id="resetBtn" class="link-btn" title="Neu laden">Neu laden</button>
    </footer>
  </div>

  <!-- ===================== Untere Navigation ===================== -->
  <nav class="app-nav" id="appNav">
    <button class="nav-btn is-active" data-view="dashboard">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      <span class="nav-label">Übersicht</span>
    </button>
    <button class="nav-btn" data-view="kalender">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>
      <span class="nav-label">Kalender</span>
    </button>
    <button class="nav-btn" data-view="katalog">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/><path d="M9 8h6M9 11h4"/></svg>
      <span class="nav-label">Katalog</span>
    </button>
    <button class="nav-btn" data-view="strafen">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M15.5 14.5h2.5"/></svg>
      <span class="nav-label">Konto</span>
    </button>
    <button class="nav-btn" data-more id="navMore" style="display:none">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      <span class="nav-label">Mehr</span>
    </button>
  </nav>

  <!-- Simulations-Leiste (Admin: „Ansicht als …") -->
  <div class="sim-bar" id="simBar" hidden>
    <span class="sim-text">Vorschau als <b id="simRole"></b> · nur Anzeige</span>
    <button class="sim-exit" id="simExit">Zur Admin-Ansicht</button>
  </div>

  <!-- Mehr-Menü (nur Trainer/Admin) -->
  <div class="more-sheet" id="moreSheet" hidden>
    <button class="more-backdrop" data-more-close aria-label="Schließen"></button>
    <div class="more-panel">
      <div class="more-title">Mehr</div>
      <button class="more-item" data-view="einstellungen" id="moreEinstellungen">Einstellungen</button>
      <button class="more-item" data-view="lineup" id="moreLineup" style="display:none">Aufstellung</button>
      <button class="more-item" data-view="admin" id="moreAdmin" style="display:none">Rollen</button>
    </div>
  </div>

  <!-- Supabase-Client (CDN) -> config.js (Zugang) -> db.js (Datenzugriff) -> app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
