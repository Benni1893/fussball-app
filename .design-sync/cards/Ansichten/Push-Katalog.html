<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push-Texte</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  /* Nur Geruest der Vorschaukarte - gehoert nicht zum Design-System. */
  body { padding: 0; min-height: 0; background: var(--bg-1); }
  .sp { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .sp-h { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
  .meta { font-size: .7rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; margin-top: 7px; line-height: 1.6; }
  .frame { width: 390px; max-width: 100%; padding: 20px 16px; background: var(--grad-app); border-radius: 12px; }
  /* Blaetter liegen in der App fest am Bildschirmrand; transform macht den Rahmen zum Bezug. */
  .frame-blatt { position: relative; padding: 0; overflow: hidden; transform: translateZ(0); }
</style>
</head>
<body>
<div class="sp">
  <div>
    <div class="sp-h">Push-Texte</div>
    <p class="meta">Gruppen nach Thema, Zeile mit Textvorlage (Final 25). Erzeugt aus dem Markup der App (kartenbau.mjs).</p>
  </div>
  <div>
    <div class="sp-h">25 Push-Texte</div>
    <div class="frame">
<div class="ein-kopf"><button class="ein-back" type="button">‹ Einstellungen</button><span class="ein-kopf-t">Push-Texte</span></div><div class="ein-body ein-anim-rein"><div class="ein-h1-zeile"><h1 class="ein-h1">Push-Texte</h1><button class="link-btn kal-plus" type="button">Alle senden</button></div><div class="group-head"><h2>Termine</h2></div><div class="ein-gruppe ein-gruppe-gross"><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Neuer Termin</span><span class="ein-schalter-s pkat-vorlage">{liste}. Jetzt zu- oder absagen.</span></span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Termin geändert</span><span class="ein-schalter-s pkat-vorlage">{datum}: {aenderung}</span></span><span class="mark is-rot">zeitkritisch</span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Erinnerung vor Meldeschluss</span><span class="ein-schalter-s pkat-vorlage">{datum} {uhrzeit} · Meldeschluss {meldeschluss}. Ohne Antwort wird's teuer.</span></span><span class="mark is-rot">zeitkritisch</span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Termin fällt aus</span><span class="ein-schalter-s pkat-vorlage">{datum} {uhrzeit}. {grund}</span></span><span class="mark is-rot">zeitkritisch</span><span class="ein-chev">›</span></button></div><div class="group-head"><h2>Strafen</h2></div><div class="ein-gruppe ein-gruppe-gross"><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Neue Strafe</span><span class="ein-schalter-s pkat-vorlage">{grund}, {datum}. Bar, Überweisung oder PayPal.</span></span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Zahlung bestätigt</span><span class="ein-schalter-s pkat-vorlage">{anzahl} Strafen, {betrag} verbucht.</span></span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Zahlung abgelehnt</span><span class="ein-schalter-s pkat-vorlage">{betrag}: {grund}. Bitte mit dem Kassenwart klären.</span></span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Monatliche Erinnerung an offene Strafen</span><span class="ein-schalter-s pkat-vorlage">{anzahl} Strafen, älteste vom {datum}.</span></span><span class="ein-chev">›</span></button></div><div class="group-head"><h2>Für Trainer</h2></div><div class="ein-gruppe ein-gruppe-gross"><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Kurzfristige Absagen</span><span class="ein-schalter-s pkat-vorlage">{termin_titel} {datum} {uhrzeit}: {namen}</span></span><span class="mark is-rot">zeitkritisch</span><span class="ein-chev">›</span></button><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Übersicht nach Meldeschluss</span><span class="ein-schalter-s pkat-vorlage">{uhrzeit} · ✅ {zusagen} · ❌ {absagen} · ❓ {offen}</span></span><span class="ein-chev">›</span></button></div><div class="group-head"><h2>Für die Kasse</h2></div><div class="ein-gruppe ein-gruppe-gross"><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Zahlung gemeldet</span><span class="ein-schalter-s pkat-vorlage">{namen}, {betrag}. Jetzt bestätigen.</span></span><span class="ein-chev">›</span></button></div><div class="group-head"><h2>System</h2></div><div class="ein-gruppe ein-gruppe-gross"><button class="ein-schalter ein-wertzeile pkat-zeile" type="button"><span class="ein-schalter-main"><span class="ein-schalter-t">Testnachricht</span><span class="ein-schalter-s pkat-vorlage">Benachrichtigungen funktionieren ✅</span></span><span class="ein-chev">›</span></button></div><div class="group-head"><h2>Vorschauen</h2></div><div class="ein-gruppe"><button class="ein-zeile ohne-ic" type="button"><span class="ein-zeile-t">Vorschauen löschen</span></button></div><p class="ein-hinweis">„Alle senden“ und „An mich senden“ gehen nur an dich, ohne Ruhezeit.</p><div class="cal-copied" hidden=""></div></div>
    </div>
  </div>
</div>
</body>
</html>
