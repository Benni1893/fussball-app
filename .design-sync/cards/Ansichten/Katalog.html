<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strafenkatalog</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  /* Nur Geruest der Vorschaukarte - gehoert nicht zum Design-System. */
  body { padding: 0; min-height: 0; background: var(--bg-1); }
  .sp { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .sp-h { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
  .meta { font-size: .7rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; margin-top: 7px; line-height: 1.6; }
  .frame { width: 390px; max-width: 100%; padding: 20px 16px; background: var(--grad-app); border-radius: 12px; }
  /* Blaetter liegen in der App fest am Bildschirmrand; transform macht den Rahmen zum Bezug. */
  .frame-blatt { position: relative; padding: 0; overflow: hidden; transform: translateZ(0); }
</style>
</head>
<body>
<div class="sp">
  <div>
    <div class="sp-h">Strafenkatalog</div>
    <p class="meta">Kacheln mit „›“, Bearbeiten im Blatt (Final 17). Erzeugt aus dem Markup der App (kartenbau.mjs).</p>
  </div>
  <div>
    <div class="sp-h">17 Katalog</div>
    <div class="frame">

      <div class="page-head h1row kal-kopf"><h1>Strafenkatalog</h1><button class="link-btn kal-plus" type="button">+ Strafe</button></div>
      <div class="kat-list">
        <button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Zu spät zum Spiel oder Treffpunkt</span></span><span class="kat-amount">10,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Unentschuldigtes Fehlen (Training)</span></span><span class="kat-amount">15,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Unentschuldigtes Fehlen (Spiel)</span></span><span class="kat-amount">25,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Verspätete Absage (unter 24 Std.)</span></span><span class="kat-amount">8,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Zu spät zum Training</span><span class="kat-sub">je 5 Minuten</span></span><span class="kat-amount">1,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Handy klingelt in der Besprechung</span></span><span class="kat-amount">5,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Gelb-Rote Karte (Meckern)</span></span><span class="kat-amount">10,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Rote Karte (unsportlich)</span></span><span class="kat-amount">20,00 €</span><span class="row-chev">›</span></button><button type="button" class="kat-item is-tap"><span class="kat-main"><span class="kat-name">Trikot vergessen</span></span><span class="kat-amount">3,00 €</span><span class="row-chev">›</span></button>
      </div>
    
    </div>
  </div>
</div>
</body>
</html>
