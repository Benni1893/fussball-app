<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const I = {
      bell: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4', moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      cal: 'M5 4.5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2zM3 9h18M8 2.5v4M16 2.5v4',
      list: 'M4 5h16v14H4zM4 10h16M9 5v14', book: 'M5 4h14v16H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12M9 8h6M9 11h4',
      msg: 'M4 5h16v11H9l-5 4zM8 9h8M8 12h5', user: 'M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0',
      pulse: 'M3 12h4l2-5 4 10 2-5h6', reload: 'M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5',
    };
    const bt = i => (i ? '1px solid var(--line)' : '0');
    const g = (name, rows) => ({ name, rows: rows.map(([label, val, icon], i) => ({ label, val, icon, bt: bt(i) })) });
    const p = (name, rows) => ({ name, rows: rows.map(([label, on], i) => ({ label, on, off: !on, bt: bt(i) })) });
    return {
      gruppen: [
        g('Für mich', [['Mitteilungen', 'An', I.bell], ['Ruhezeiten', '22 bis 8 Uhr', I.moon], ['Kalender abonnieren', 'Aus', I.cal]]),
        g('Verwaltung', [['Spielplan BFV', 'Verbunden', I.list], ['Strafenkatalog', '', I.book], ['Push-Texte', '', I.msg], ['Rollen', '16', I.user]]),
        g('Info', [['Diagnose', '', I.pulse], ['App neu laden', '', I.reload]]),
      ],
      pushGruppen: [
        p('Termine', [['Neuer oder geänderter Termin', true], ['Erinnerung vor Meldeschluss', true], ['Aufstellung veröffentlicht', true]]),
        p('Strafen', [['Neue Strafe', true], ['Zahlung bestätigt', false]]),
      ],
    };
  }
}
</script>
