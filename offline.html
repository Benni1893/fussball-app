<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · FC Fasanerie-Nord</title>
<!-- Alles inline: diese Seite erscheint, wenn das Netz weg ist. Ein Verweis
     auf styles.css waere dann ebenfalls nicht erreichbar. -->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(16px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, #e9ecea 0%, #e0e4e2 100%);
    color: #1c2620;
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .k {
    width: 100%; max-width: 358px; background: #fff; border-radius: 14px;
    padding: 28px 22px;
    box-shadow: 0 0 0 1px rgba(16,40,30,.06), 0 3px 8px -3px rgba(16,40,30,.20);
  }
  .ic {
    width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 14px;
    background: linear-gradient(180deg, #fdf6e4, #f6ebcd); color: #144a37;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { margin: 0 0 8px; font-size: 19px; font-weight: 800; letter-spacing: -.012em; }
  p  { margin: 0; font-size: 14px; color: #66756d; }           /* 4,85:1 auf Weiss */
  button {
    margin-top: 20px; width: 100%; min-height: 46px; border: 0; border-radius: 14px;
    background: linear-gradient(180deg, #17573f, #0f3d2e); color: #fff;
    font: inherit; font-size: 16px; font-weight: 800; letter-spacing: -.012em;
  }
</style>
</head>
<body>
  <div class="k">
    <div class="ic" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/><path d="M2 9a15 15 0 0 1 20 0"/>
      </svg>
    </div>
    <h1>Keine Verbindung</h1>
    <p>Die App braucht Netz, um Termine und Strafen zu laden. Sobald du wieder online bist, geht es weiter.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
